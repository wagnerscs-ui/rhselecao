<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teste técnico · Complementare</title>
<link rel="stylesheet" href="/assets/estilo.css">
</head>
<body>
<header class="topo"><div class="dentro">
  <span class="marca">Complementare Projetos de Instalações</span>
  <span id="relogio" class="relogio" hidden>--:--</span>
</div></header>
<main id="app"><div class="cartao centro muted">Carregando…</div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="dentro">
  <h3 id="dlg-titulo"></h3>
  <div id="dlg-texto"></div>
  <div class="acoes">
    <button class="botao sec" id="dlg-nao" type="button">Voltar ao teste</button>
    <button class="botao" id="dlg-sim" type="button">Enviar respostas</button>
  </div>
</div></dialog>
<script src="/assets/imagem.js"></script>
<script src="/assets/teste.js"></script>
</body>
</html>
